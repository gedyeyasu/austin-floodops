<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <rect width="1000" height="700" fill="#070b0a"/>
  <style>
    .box { fill:#111a16; stroke:#3a5046; stroke-width:1.2; }
    .title { fill:#edf4f0; font-family: monospace; font-size:13px; font-weight:600; }
    .sub { fill:#91a39a; font-family: monospace; font-size:10px; }
    .arrow { stroke:#7cf7ad; stroke-width:1.2; marker-end:url(#arrow); }
    .line { stroke:#26342e; stroke-width:1; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7cf7ad"/></marker></defs>
  <text x="20" y="30" class="title">Austin FloodOps v0.3.0 Enterprise - 16 integrations</text>

  <!-- Sources -->
  <rect x="20" y="50" width="160" height="60" class="box"/><text x="30" y="68" class="title">NWS alerts</text><text x="30" y="82" class="sub">api.weather.gov</text>
  <rect x="20" y="120" width="160" height="60" class="box"/><text x="30" y="138" class="title">USGS gage</text><text x="30" y="152" class="sub">waterservices.usgs</text>
  <rect x="20" y="190" width="160" height="60" class="box"/><text x="30" y="208" class="title">Austin crossings</text><text x="30" y="222" class="sub">q3y8-2xnm road fw5i</text><text x="30" y="234" class="sub">floodplain 3p2e-ps67</text>

  <!-- Ingest -->
  <rect x="220" y="80" width="170" height="90" class="box"/><text x="230" y="100" class="title">HeartbeatEngine</text><text x="230" y="114" class="sub">30s poll, dedup IDs</text><text x="230" y="126" class="sub">sources status</text><text x="230" y="138" class="sub">run_cycle returns dict</text>

  <!-- Store -->
  <rect x="430" y="80" width="150" height="90" class="box"/><text x="440" y="100" class="title">Store SQLite</text><text x="440" y="114" class="sub">events, decisions</text><text x="440" y="126" class="sub">feedback, memories</text><text x="440" y="138" class="sub">authoritative</text>

  <!-- Kafka -->
  <rect x="430" y="190" width="150" height="60" class="box"/><text x="440" y="210" class="title">Kafka / Redpanda</text><text x="440" y="224" class="sub">degraded safe</text>

  <!-- Memory -->
  <rect x="220" y="200" width="170" height="60" class="box"/><text x="230" y="220" class="title">Memory ranking</text><text x="230" y="234" class="sub">top 3 active rules</text>

  <!-- LLM -->
  <rect x="620" y="50" width="170" height="80" class="box"/><text x="630" y="70" class="title">NVIDIA Nemotron</text><text x="630" y="84" class="sub">primary OpenAI compat</text><text x="630" y="98" class="sub">vLLM fallback</text><text x="630" y="112" class="sub">/v1/models probe</text>

  <!-- Security -->
  <rect x="620" y="140" width="170" height="80" class="box"/><text x="630" y="160" class="title">Security Gate</text><text x="630" y="174" class="sub">HiddenLayer scan</text><text x="630" y="186" class="sub">policy evaluate</text><text x="630" y="198" class="sub">OpenShell boundary</text>

  <!-- Service -->
  <rect x="430" y="280" width="360" height="90" class="box"/><text x="440" y="300" class="title">FloodOpsService + AuditChain</text><text x="440" y="314" class="sub">audit optional, post_init, SHA256 chain</text><text x="440" y="328" class="sub">evidence_ingested, decision_created, blocked, approved, feedback, memory, prediction, delivery</text><text x="440" y="342" class="sub">vLLM fallback, 2-arg compat</text>

  <!-- Prediction -->
  <rect x="20" y="400" width="210" height="90" class="box"/><text x="30" y="420" class="title">Prediction</text><text x="30" y="434" class="sub">GagePoint Forecast OLS ft/h</text><text x="30" y="446" class="sub">risk_trajectory alert+gage+mem</text><text x="30" y="458" class="sub">GAGE_THRESH 5/8/11/13 ft</text><text x="30" y="470" class="sub">predict_future + impact</text>

  <!-- Routing -->
  <rect x="250" y="400" width="180" height="90" class="box"/><text x="260" y="420" class="title">Routing OSRM</text><text x="260" y="434" class="sub">RoutePoint EvacRoute</text><text x="260" y="446" class="sub">_osrm_route project-osrm.org</text><text x="260" y="458" class="sub">haversine fallback</text>

  <!-- After action -->
  <rect x="450" y="400" width="200" height="90" class="box"/><text x="460" y="420" class="title">After-action + FOIA</text><text x="460" y="434" class="sub">timeline, metrics</text><text x="460" y="446" class="sub">compliance, FOIA redact</text><text x="460" y="458" class="sub">positive narrative</text>

  <!-- API -->
  <rect x="20" y="520" width="960" height="80" class="box"/><text x="30" y="540" class="title">FastAPI 0.3.0 Enterprise Gov-Grade - 16 integrations health</text><text x="30" y="556" class="sub">/api/assess /simulate /predict /floodplain /routing/detour /audit/recent /audit/{'{id}'} /audit/verify/{'{id}'} /after-action/{'{id}'} /auth/token /auth/me /integrations/vllm/probe /osrm/probe + core /events /decisions /memories /feedback /cap /first-responder /webeoc /evaluation</text><text x="30" y="572" class="sub">RBAC: viewer operator supervisor admin auditor system - current_actor returns system when ENABLE_RBAC false for demo, require_role require_action create_token pyjwt</text>

  <!-- Frontend -->
  <rect x="20" y="620" width="960" height="60" class="box"/><text x="30" y="638" class="title">Static Dashboard Enterprise - Leaflet map + prediction + routing + audit + after-action + RBAC panel + JS runPrediction runRouting loadFloodplain refreshAudit generateAfterAction setAuthToken getTokenAs ensureMap renderMap probeVLLM probeOSRM</text><text x="30" y="654" class="sub">Dockerfile + docker-compose Redpanda + Makefile docker-build/run/down/logs + .env.example VLLM JWT OSRM toggles + openshell yaml v1 include_workdir true read_only read_write landlock</text>

