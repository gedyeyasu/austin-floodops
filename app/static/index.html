<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Austin FloodOps</title>
  <style>
    :root { color-scheme: dark; --ink:#e8f0ec; --muted:#9db0a5; --bg:#08110e; --panel:#10201a; --accent:#59e39a; --warn:#ffc857; }
    * { box-sizing:border-box; } body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:radial-gradient(circle at 80% 0,#183c2a 0,#08110e 42%); color:var(--ink); }
    main { max-width:1100px; margin:auto; padding:36px 20px 60px; } header { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:28px; }
    h1 { font-size:clamp(2rem,5vw,4.2rem); line-height:.95; margin:0; letter-spacing:-.06em; } p { color:var(--muted); }
    button { border:0; border-radius:999px; padding:11px 18px; background:var(--accent); color:#042015; font-weight:800; cursor:pointer; } button.secondary { background:#214235; color:var(--ink); }
    .grid { display:grid; grid-template-columns:1.4fr .9fr; gap:16px; } .panel { background:rgba(16,32,26,.88); border:1px solid #28503c; border-radius:18px; padding:20px; box-shadow:0 15px 60px #0005; }
    .panel h2 { margin-top:0; } .status { display:flex; justify-content:space-between; border-bottom:1px solid #28503c; padding:10px 0; } .pill { border-radius:99px; padding:4px 9px; font-size:.78rem; background:#214235; } .pill.warn { color:#211500; background:var(--warn); }
    pre { white-space:pre-wrap; font-size:.85rem; color:#c8ddd0; max-height:340px; overflow:auto; } .actions { display:flex; gap:10px; flex-wrap:wrap; } .empty { color:var(--muted); padding:30px 0; }
    @media (max-width:760px) { header,.grid { display:block; } header button { margin-top:20px; } .panel { margin-top:16px; } }
  </style>
</head>
<body>
<main>
  <header><div><p>AUSTIN FLOODOPS / NEMOTRON DECISION SUPPORT</p><h1>Turn rising water into a safe next move.</h1><p>Official NWS + USGS evidence, one reversible action, human approval.</p></div><button id="assess">Run live assessment</button></header>
  <div class="grid"><section class="panel"><h2>Incident brief</h2><div id="incident" class="empty">Run an assessment to correlate live evidence.</div></section><aside class="panel"><h2>Integration gate</h2><div id="health"></div></aside></div>
  <section class="panel" style="margin-top:16px"><h2>Evidence ledger</h2><pre id="events">No evidence captured yet.</pre></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function refreshHealth(){ const r=await fetch('/health'); const h=await r.json(); $('health').innerHTML=h.integrations.map(i=>`<div class="status"><span>${i.name}</span><span class="pill ${i.configured?'':'warn'}">${i.configured?'configured':'needs key'}</span></div>`).join(''); }
function render(data){ $('events').textContent=JSON.stringify(data.events,null,2); if(!data.decision){ $('incident').innerHTML=`<p class="pill warn">ASSESSMENT BLOCKED</p><p>${data.error||'No decision returned.'}</p>`; return; } const d=data.decision; $('incident').innerHTML=`<p><span class="pill">${d.risk_level.toUpperCase()}</span> · confidence ${(d.confidence*100).toFixed(0)}%</p><h3>${d.summary}</h3><p>${d.proposed_action.rationale}</p><p><strong>Proposed:</strong> ${d.proposed_action.action_type} → ${d.proposed_action.target}</p><div class="actions"><button class="secondary" onclick="approve('${d.incident_id}')">Approve reversible action</button><button class="secondary" onclick="feedback('${d.incident_id}')">Add correction</button></div>`; }
async function run(){ $('assess').disabled=true; $('assess').textContent='Gathering…'; try{ const r=await fetch('/api/assess',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'live',scenario_id:'east-austin-night-market'})}); render(await r.json()); } finally { $('assess').disabled=false; $('assess').textContent='Run live assessment'; } }
async function approve(id){ const r=await fetch('/api/decisions/'+id+'/approve',{method:'POST'}); alert(JSON.stringify(await r.json())); }
async function feedback(id){ const correction=prompt('What should the operator remember next time?'); if(!correction)return; await fetch('/api/decisions/'+id+'/feedback',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({correction,outcome:'helpful'})}); alert('Versioned operator correction saved.'); }
$('assess').onclick=run; refreshHealth();
</script>
</body>
</html>
