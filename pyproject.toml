[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "austin-floodops"
version = "0.1.0"
description = "Approval-gated live flood-response coordination using official public data and Nemotron."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
streaming = ["kafka-python>=2.0,<3"]
supabase = ["supabase>=2.15,<3"]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
