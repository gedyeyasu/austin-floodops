[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "austin-floodops"
version = "0.3.0"
description = "Approval-gated flood decision support with live public evidence, Nemotron, HiddenLayer, and Kafka-compatible streaming."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
  "pyjwt>=2.8,<3",
]

[project.optional-dependencies]
streaming = ["kafka-python>=2.0,<3"]
supabase = ["supabase>=2.15,<3"]
security = ["hiddenlayer-sdk>=3.8,<4"]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]
texas = ["kafka-python>=2.0,<3", "supabase>=2.15,<3", "hiddenlayer-sdk>=3.8,<4", "pyjwt>=2.8,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
